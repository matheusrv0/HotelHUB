<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="stylesheet" href="css/login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poiret+One&display=swap"
  rel="stylesheet"
/>
</head>
<body>

  <body>

  <div class="auth-container">

    <a class="brand" href="index.html">
      <span class="brand-mark">
        <span class="brand-window"></span>
      </span>

      <span class="brand-name">
        HotelHub
      </span>
    </a>

    <h1>Entrar</h1>

    <p class="subtitle">
      Acesse sua conta para continuar.
    </p>

    <form id="login-form">

      <div class="form-group">
        <label>Email</label>

        <input
          type="email"
          id="login-email"
          placeholder="Digite seu email"
          required
        >
      </div>

      <div class="form-group">
        <label>Senha</label>

        <input
          type="password"
          id="login-password"
          placeholder="Digite sua senha"
          required
        >
      </div>

      <button class="primary-button" type="submit">
        Entrar
      </button>

      <button
        type="button"
        class="primary-button"
        id="google-login"
        >
  Entrar com Google
</button>

    </form>

    <p class="bottom-text">
      Não possui conta?
      <a href="cadastro.html">
        Criar conta
      </a>
    </p>

  </div>

  <script type="module" src="js/auth.js"></script>

</body>

</body>
</html>
