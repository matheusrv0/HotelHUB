<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="stylesheet" href="css/admin.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poiret+One&display=swap"
  rel="stylesheet"
/>
</head>
<body>

  <div class="container">

    <a href="index.html" class="back-button">
  ← Voltar a aba principal
  </a>

    <h1>Painel Administrativo</h1>

    <form id="hotel-form">

      <input type="text" id="name" placeholder="Nome do hotel" required />

      <input type="text" id="destination" placeholder="Destino" required />

      <input type="number" id="price" placeholder="Preço" required />

      <input type="number" id="rating" placeholder="Avaliação" required />

      <input type="number" id="maxGuests" placeholder="Máx hóspedes" required />

      <input type="file" id="image" accept="image/*" required />

      <input type="date" id="availableFrom" required />

      <input type="date" id="availableTo" required />

      <textarea id="description" placeholder="Descrição"></textarea>

      <button type="submit">
        Salvar Hotel
      </button>

    </form>

    <div class="hotel-list" id="hotel-list"></div>

  </div>

 <script type="module" src="js/admin.js"></script>

</body>
</html>
