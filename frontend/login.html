<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - HotelHub</title>

    <link rel="stylesheet" href="css/login.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poiret+One&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="auth-container">
      <a class="brand" href="index.html">
        <span class="brand-mark">
          <span class="brand-window"></span>
        </span>

        <span class="brand-name">HotelHub</span>
      </a>

      <h1>Entrar</h1>

      <p class="subtitle">
        Acesse sua conta para continuar.
      </p>

      <p id="auth-message" class="auth-message"></p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>

          <input
            type="email"
            id="login-email"
            placeholder="Digite seu email"
            required
          />
        </div>

        <div class="form-group">
          <label for="login-password">Senha</label>

          <input
            type="password"
            id="login-password"
            placeholder="Digite sua senha"
            required
          />
        </div>

        <button class="primary-button" type="submit">
          Entrar
        </button>

        <button class="primary-button google-button" type="button" id="google-login">
          Entrar com Google
        </button>
      </form>

      <p class="bottom-text">
        Não possui conta?
        <a href="cadastro.html">Criar conta</a>
      </p>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
